<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a84ff" />
  <title>Leilei0106 – Apps</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a84ff'/%3E%3Ctext x='50%25' y='58%25' text-anchor='middle' fill='white' font-family='-apple-system,sans-serif' font-size='34' font-weight='700'%3EL%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #f2f2f7;
      --bg-elev: #ffffff;
      --text: #1c1c1e;
      --text-secondary: #6e6e73;
      --separator: rgba(60, 60, 67, 0.18);
      --accent: #0a84ff;
      --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 14px rgba(0,0,0,0.05);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000;
        --bg-elev: #1c1c1e;
        --text: #fff;
        --text-secondary: #98989f;
        --separator: rgba(84, 84, 88, 0.6);
        --shadow: 0 1px 2px rgba(0,0,0,0.4);
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 17px; line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 560px; margin: 0 auto;
      min-height: 100vh; min-height: 100dvh;
      padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
      display: flex; flex-direction: column;
    }
    header { padding: 32px 4px 20px; }
    h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }
    header p { margin: 6px 0 0; color: var(--text-secondary); font-size: 16px; }
    main { flex: 1; display: flex; flex-direction: column; gap: 12px; padding-bottom: 24px; }
    .app-card {
      background: var(--bg-elev);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 14px;
      text-decoration: none; color: inherit;
      transition: transform 0.08s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .app-card:active { transform: scale(0.985); }
    .app-icon {
      width: 60px; height: 60px; border-radius: 14px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--accent); color: white;
      overflow: hidden;
    }
    .app-icon img { width: 100%; height: 100%; display: block; }
    .app-body { flex: 1; min-width: 0; }
    .app-title { font-size: 17px; font-weight: 600; margin: 0; }
    .app-desc { font-size: 14px; color: var(--text-secondary); margin: 2px 0 0; }
    .chev { color: var(--text-secondary); font-size: 20px; padding-right: 4px; }
    footer { padding: 12px 4px 24px; text-align: center; color: var(--text-secondary); font-size: 13px; }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Meine Apps</h1>
      <p>Kleine Web-Apps im iPhone-Look. Zum Home-Bildschirm hinzufügen für App-Feeling.</p>
    </header>

    <main>
      <a class="app-card" href="apps/Tankrechner/">
        <span class="app-icon"><img src="apps/Tankrechner/icon.svg" alt="" /></span>
        <span class="app-body">
          <p class="app-title">Tankrechner</p>
          <p class="app-desc">Spritverbrauch, Kosten und Verlauf deines Autos.</p>
        </span>
        <span class="chev" aria-hidden="true">›</span>
      </a>

      <a class="app-card" href="apps/Transcript/">
        <span class="app-icon"><img src="apps/Transcript/icon.svg" alt="" /></span>
        <span class="app-body">
          <p class="app-title">Transcript</p>
          <p class="app-desc">Diktieren, Korrigieren und im Buchdesign lesen.</p>
        </span>
        <span class="chev" aria-hidden="true">›</span>
      </a>
    </main>

    <footer>
      <a href="https://github.com/Leilei0106/Leilei0106">Quellcode auf GitHub</a>
    </footer>
  </div>
</body>
</html>
