<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Transcript – Diktieren &amp; Korrigieren</title>
  <meta name="description" content="Diktiere deutschen Text, korrigiere automatisch und lies ihn im Buchdesign.">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#8a6d3b">
  <link rel="icon" href="icon.svg" type="image/svg+xml">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Transcript">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icon.svg">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Transcript</h1>
    <p class="subtitle">Diktieren · Rechtschreibung &amp; Satzstellung · Buchdesign</p>
  </header>
  <main>
    <section class="editor">
      <div class="input-head">
        <label for="input">Dein Text</label>
        <div class="viz" id="viz" hidden aria-hidden="true">
          <span class="viz-label">Ich höre zu</span>
          <span class="bars"><span></span><span></span><span></span><span></span><span></span></span>
        </div>
      </div>
      <div class="textarea-wrap" id="ta-wrap">
        <textarea id="input" placeholder="Tippe hier oder drücke „Diktieren“, um per Mikrofon zu sprechen …"></textarea>
      </div>
      <div class="actions">
        <button id="record" type="button" class="record">
          <span class="dot" aria-hidden="true"></span>
          <span class="label">Diktieren</span>
        </button>
        <button id="correct" type="button">Korrigieren</button>
        <button id="clear" type="button" class="ghost">Leeren</button>
        <button id="install" type="button" class="ghost" hidden>App installieren</button>
        <label class="auto">
          <input type="checkbox" id="auto-correct" checked>
          Nach Aufnahme automatisch korrigieren
        </label>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <details class="changes" id="changes" hidden>
        <summary>Vorgenommene Korrekturen (<span id="change-count">0</span>)</summary>
        <ol id="change-list"></ol>
      </details>
    </section>
    <section class="book" aria-label="Buchvorschau">
      <article class="page" id="page">
        <p class="placeholder">Hier erscheint dein korrigierter Text im Buchdesign.</p>
      </article>
    </section>
  </main>
  <footer>
    <p>Diktat via Web Speech API · Korrektur via <a href="https://languagetool.org" target="_blank" rel="noopener">LanguageTool</a> · Sprache: Deutsch (de-DE)</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
